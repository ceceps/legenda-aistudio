services:
  # ── Dev container (Node 22) ────────────────────────────────────────────────
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu-24.04
    volumes:
      - ../:/workspaces/legenda-aistudio:cached
    # Keep container alive
    command: sleep infinity
    environment:
      # These are read from the Codespace secrets / .env
      DATABASE_URL: postgresql://legendauser:legendapass@postgres:5432/legenda_db
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    network_mode: service:postgres

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: legendauser
      POSTGRES_PASSWORD: legendapass
      POSTGRES_DB: legenda_db
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legendauser -d legenda_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-dev-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:
  redis-dev-data:
